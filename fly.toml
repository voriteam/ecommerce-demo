# Fly.io deployment for the Vori API demo storefront.
#
# See the README for the one-time setup (volume, secrets) before `fly deploy`.

app = 'ecommerce-demo'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  # The SQLite file lives on the mounted volume, not in the image, so it
  # survives deploys. A real file on a real disk is the reason this demo is
  # here rather than on a host with an ephemeral filesystem.
  DATABASE_URI = 'file:/data/ecommerce-demo.db'
  NODE_ENV = 'production'
  PORT = '3000'
  VORI_API_BASE_URL = 'https://api.vori.com'

[http_service]
  internal_port = 3000
  force_https = true

  # Both of these matter, and for the same reason.
  #
  # The inventory poll runs in-process on a cron inside the app. A stopped
  # machine polls nothing, so the storefront's stock levels would freeze
  # until the next visitor woke it — which is exactly the behaviour this
  # demo exists to disprove. Suspending is no better: the schedule does not
  # resume mid-interval.
  #
  # It also means exactly one machine should ever run. Two would both hold
  # the same SQLite file over a shared volume and both run the poll.
  auto_start_machines = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/'
    timeout = '10s'

[mounts]
  source = 'data'
  destination = '/data'
  # One machine, one volume. Fly will not auto-extend a volume it is asked to
  # share, and neither should this demo.
  initial_size = '1gb'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
