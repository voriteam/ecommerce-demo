name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - run: pnpm test
        env:
          DATABASE_URI: file:./ci.db
          PAYLOAD_SECRET: ci-secret-not-used-anywhere-real

      - run: pnpm build
        env:
          DATABASE_URI: file:./ci-build.db
          PAYLOAD_SECRET: ci-secret-not-used-anywhere-real
