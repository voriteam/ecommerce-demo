# Everything the demo needs to run. `docker compose up -d` is the whole database story.
#
# Ports are deliberately non-default so this never fights with a Postgres or Redis
# you already have running locally.
services:
  postgres:
    image: postgres:17-alpine
    container_name: vori-demo-postgres
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medusa -d medusa']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: vori-demo-redis
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
